[project]
name = "cci-diff"
version = "0.1.0"
description = "Causal Concept Intervention Diffusion utilities for bias-aware visual counterfactual explanations."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = [
  "torch",
  "torchvision",
  "diffusers",
  "huggingface_hub",
  "transformers",
  "accelerate",
  "safetensors",
  "open-clip-torch",
  "pillow",
  "numpy",
  "opencv-python>=4.10,<5",
  "grad-cam>=1.5,<2",
]
identity-export = [
  "facenet-pytorch==2.6.0",
]
plot = [
  "matplotlib>=3.8",
]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
